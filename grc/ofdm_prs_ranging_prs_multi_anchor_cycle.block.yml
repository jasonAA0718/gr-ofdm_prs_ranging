id: ofdm_prs_ranging_prs_multi_anchor_cycle
label: PRS Multi-Anchor Ranging Cycle
category: '[ofdm_prs_ranging]'
templates:
  imports: from gnuradio import ofdm_prs_ranging
  make: ofdm_prs_ranging.prs_multi_anchor_cycle(${samp_rate}, ${anchor_ids}, ${time_delays}, ${preamble_len}, ${preamble_repeats}, ${coarse_sync_len}, ${window_before_s}, ${window_after_s}, ${processing_grace_s}, ${cfo_max_age_s})
parameters:
- {id: samp_rate, label: Sample Rate, dtype: real, default: 30e6}
- {id: anchor_ids, label: Expected Anchor IDs (1..8), dtype: int_vector, default: '[0, 1]'}
- {id: time_delays, label: Expected Response Delays (seconds), dtype: real_vector, default: '[0.031, 0.081]'}
- {id: preamble_len, label: Response Preamble Length, dtype: int, default: 128}
- {id: preamble_repeats, label: Response Preamble Repeats, dtype: int, default: 17}
- {id: coarse_sync_len, label: Response ZC Length, dtype: int, default: 819}
- {id: window_before_s, label: Early Margin (s), dtype: real, default: 0.002}
- {id: window_after_s, label: Late Margin After Full Frame (s), dtype: real, default: 0.005}
- {id: processing_grace_s, label: DSP Drain Grace (s), dtype: real, default: 0.1}
- {id: cfo_max_age_s, label: CFO Reference Lifetime (s), dtype: real, default: 5.0}
inputs:
- {label: tx_time_in, domain: message}
- {label: clock_in, domain: message}
- {label: measurement_in, domain: message}
- {label: range_in, domain: message}
outputs:
- {label: window_out, domain: message}
- {label: solver_tx_out, domain: message}
- {label: solver_measurement_out, domain: message}
- {label: measurement_out, domain: message}
- {label: cycle_out, domain: message, optional: true}
- {label: epoch_out, domain: message, optional: true}
- {label: observation_out, domain: message, optional: true}
- {label: diagnostic_out, domain: message, optional: true}
documentation: |-
  Configure 1..8 unique anchor IDs (0..7) and corresponding static delays in seconds.
  The POLL does not carry the schedule. Complete receive windows must not overlap.
  Individual ranges are published on measurement_out; every finalized cycle has a cycle_out summary.
  epoch_out publishes (metadata, NIL) only at normal finalization after processing grace,
  when ALL configured anchors have accepted ranges and at least three anchors are configured.
  Epoch arrays and full measurement dictionaries follow configured anchor_ids order.
  Invalid fine correction preserves the integer range, NaN corrected value and validity flag.
  Missing anchors, one/two-anchor cycles and shutdown do not produce complete epochs.
  observation_out publishes every finalized cycle, including partial/empty observations and shutdown.
  Its aligned vectors contain only accepted anchors in configured order; completion_reason marks shutdown.
  Connect observation_out to position solver epoch_in to log all positioning outcomes.
  Validated per-anchor channel CFO is cached independently across cycles.
  window_out snapshots its own anchor CFO only when coherence >=0.2 and its age
  at window start is within cfo_max_age_s. No reference means detector bootstrap.
file_format: 1
