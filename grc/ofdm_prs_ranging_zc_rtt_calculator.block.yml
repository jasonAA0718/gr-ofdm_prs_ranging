id: ofdm_prs_ranging_zc_rtt_calculator
label: ZC RTT Calculator
category: '[ofdm_prs_ranging]/ZC RTT'
templates:
  imports: from gnuradio import ofdm_prs_ranging
  make: ofdm_prs_ranging.zc_rtt_calculator(${samp_rate}, ${zc_length}, ${delay_secs}, ${peak_metric_threshold}, ${fixed_threshold}, ${distance_setting_m}, ${log_path})
parameters:
- {id: samp_rate, label: Sample Rate, dtype: real, default: 6e6}
- {id: zc_length, label: ZC Length, dtype: int, default: 839}
- {id: delay_secs, label: Delay Secs, dtype: real, default: 0.005}
- {id: peak_metric_threshold, label: Peak Metric Threshold, dtype: real, default: 0.35}
- {id: fixed_threshold, label: Fixed Threshold, dtype: real, default: 0.0}
- {id: distance_setting_m, label: Distance Setting m, dtype: real, default: 0.0}
- {id: log_path, label: Log Path, dtype: string, default: rtt_measurements.csv}
inputs:
- {label: corr, dtype: complex}
- {label: raw, dtype: complex}
- {label: tx_time_in, domain: message, optional: true}
outputs:
- {label: capture, dtype: complex}
file_format: 1
