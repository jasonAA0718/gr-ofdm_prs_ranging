id: ofdm_prs_ranging_prs_timed_burst_source
label: PRS Timed Burst Source
category: '[ofdm_prs_ranging]'

templates:
  imports: from gnuradio import ofdm_prs_ranging
  make: |-
    ofdm_prs_ranging.prs_timed_burst_source(
        ${samp_rate}, ${fft_len}, ${cp_len}, ${active_bins}, ${prs_symbols},
        ${preamble_len}, ${preamble_repeats}, ${coarse_sync_len},
        ${zero_guard_len}, ${tail_guard_len}, ${tx_lead_time},
        ${burst_period}, ${tx_amp}, ${seed}, ${pings_per_trigger},
        ${attach_tx_time}, ${coarse_zc_root})

parameters:
- id: samp_rate
  label: Sample Rate
  dtype: real
  default: 10e6
- id: fft_len
  label: FFT Length
  dtype: int
  default: 1024
- id: cp_len
  label: CP Length
  dtype: int
  default: 128
- id: active_bins
  label: Active Bins
  dtype: int
  default: 600
- id: prs_symbols
  label: PRS Symbols
  dtype: int
  default: 16
- id: preamble_len
  label: Preamble Length
  dtype: int
  default: 128
- id: preamble_repeats
  label: Preamble Repeats
  dtype: int
  default: 16
- id: coarse_sync_len
  label: Coarse Sync Length
  dtype: int
  default: 839
- id: coarse_zc_root
  label: Coarse ZC Root
  dtype: int
  default: 25
- id: zero_guard_len
  label: Zero Guard Length
  dtype: int
  default: 1000
- id: tail_guard_len
  label: Tail Guard Length
  dtype: int
  default: 1000
- id: tx_lead_time
  label: TX Lead Time
  dtype: real
  default: 0.5
- id: burst_period
  label: Burst Period
  dtype: real
  default: 0.1
- id: tx_amp
  label: TX Amplitude
  dtype: real
  default: 0.2
- id: seed
  label: Pilot Seed
  dtype: int
  default: 13990001
- id: pings_per_trigger
  label: Pings Per Trigger
  dtype: int
  default: 1
- id: attach_tx_time
  label: Attach TX Time
  dtype: bool
  default: 'True'

inputs:
- label: in
  domain: stream
  dtype: complex
  optional: true
- label: trigger
  domain: message
  optional: true

outputs:
- label: out
  domain: stream
  dtype: complex
- label: tx_time_out
  domain: message
  optional: true

file_format: 1
