id: ofdm_prs_ranging_prs_timed_burst_source
label: PRS Timed Burst Source
category: '[ofdm_prs_ranging]'

templates:
  imports: from gnuradio import ofdm_prs_ranging
  make: ofdm_prs_ranging.prs_timed_burst_source(${samp_rate}, ${tx_lead_time}, ${burst_period}, ${tx_amp}, ${pings_per_trigger}, ${attach_tx_time})

parameters:
- id: samp_rate
  label: Sample Rate
  dtype: real
  default: 10e6
- id: tx_lead_time
  label: TX Lead Time
  dtype: real
  default: 0.5
- id: burst_period
  label: Burst Period
  dtype: real
  default: 0.1
- id: tx_amp
  label: Payload/OFDM RMS
  dtype: real
  default: 0.6
- id: pings_per_trigger
  label: Pings Per Trigger
  dtype: int
  default: 1
- id: attach_tx_time
  label: Attach TX Time
  dtype: bool
  default: 'True'

inputs:
- label: in
  domain: stream
  dtype: complex
  optional: true
- label: trigger
  domain: message
  optional: true

outputs:
- label: out
  domain: stream
  dtype: complex
- label: tx_time_out
  domain: message
  optional: true

file_format: 1
