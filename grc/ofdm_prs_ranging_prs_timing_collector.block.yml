id: ofdm_prs_ranging_prs_timing_collector
label: PRS Timing Collector
category: '[ofdm_prs_ranging]'
templates:
  imports: from gnuradio import ofdm_prs_ranging
  make: ofdm_prs_ranging.prs_timing_collector(${raw_csv_path}, ${summary_csv_path}, ${role})
parameters:
- {id: raw_csv_path, label: Raw Timing CSV, dtype: string, default: '"prs_timing_raw.csv"'}
- {id: summary_csv_path, label: Summary CSV, dtype: string, default: '"prs_timing_summary.csv"'}
- {id: role, label: Role, dtype: string, default: '"unknown"'}
inputs:
- {label: timing_in, domain: message}
outputs: []
file_format: 1
