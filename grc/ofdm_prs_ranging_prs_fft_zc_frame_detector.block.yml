id: ofdm_prs_ranging_prs_fft_zc_frame_detector
label: PRS FFT-ZC Frame Detector
category: '[ofdm_prs_ranging]'
templates:
  imports: from gnuradio import ofdm_prs_ranging
  make: ofdm_prs_ranging.prs_fft_zc_frame_detector(${samp_rate}, ${threshold}, ${min_frame_gap}, ${expect_response}, ${channel_id}, ${time_gating}, ${reply_delay_s}, ${window_before_s}, ${window_after_s}, ${zc_threshold}, ${correlation_fft_len}, ${zc_search_before}, ${zc_search_after}, ${cfo_compensation})
parameters:
- {id: samp_rate, label: Sample Rate, dtype: real, default: 10e6}
- {id: threshold, label: Preamble Gate Threshold, dtype: real, default: 0.35}
- {id: zc_threshold, label: ZC Threshold, dtype: real, default: 0.35}
- {id: min_frame_gap, label: Min Frame Gap, dtype: int, default: 10000}
- {id: expect_response, label: Expect RESPONSE (False = POLL), dtype: bool, default: 'False'}
- {id: channel_id, label: Channel ID, dtype: int, default: 0}
- {id: time_gating, label: Time Gating, dtype: bool, default: 'False'}
- {id: reply_delay_s, label: Reply Delay (s), dtype: real, default: '0.05'}
- {id: window_before_s, label: Window Before (s), dtype: real, default: '0.0002'}
- {id: window_after_s, label: Window After (s), dtype: real, default: '0.004'}
- {id: correlation_fft_len, label: Correlation FFT Length, dtype: int, default: 2048}
- {id: zc_search_before, label: ZC Search Before, dtype: int, default: 1024}
- {id: zc_search_after, label: ZC Search After, dtype: int, default: 3584}
- {id: cfo_compensation, label: PRS FLL CFO Compensation, dtype: bool, default: 'True'}
inputs:
- {label: in, domain: stream, dtype: complex}
- {label: tx_time_in, domain: message, optional: true}
- {label: prs_cfo_in, domain: message, optional: true}
outputs:
- {label: frame_out, domain: message}
- {label: event_out, domain: message, optional: true}
documentation: |-
  Continuous and legacy windows use prs_cfo_in (total prs_channel_cfo_hz and coherence >=0.2).
  Managed TDMA windows carry expected_anchor_id/cycle_sequence and snapshot their own CFO
  on tx_time_in; a missing/invalid window CFO bootstraps instead of using global feedback.
  CFO Source is ANCHOR_FLL, PRS_FLL, INITIAL_BIN or DISABLED.
  With CFO compensation enabled, managed frames request pre-FFT correction using the
  selected detection CFO via pre_fft_cfo_hz. frame_out samples remain raw.
  Disabling CFO compensation disables both acquisition and managed pre-FFT correction.
file_format: 1
