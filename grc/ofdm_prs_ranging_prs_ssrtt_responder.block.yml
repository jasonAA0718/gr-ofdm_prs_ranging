id: ofdm_prs_ranging_prs_ssrtt_responder
label: PRS SS-RTT Responder
category: '[ofdm_prs_ranging]'
templates:
  imports: from gnuradio import ofdm_prs_ranging
  make: ofdm_prs_ranging.prs_ssrtt_responder(${samp_rate}, ${reply_delay_samples})
parameters:
- {id: samp_rate, label: Sample Rate, dtype: real, default: 10e6}
- {id: reply_delay_samples, label: Reply Delay Samples, dtype: int, default: 50000}
inputs:
- {label: measurement_in, domain: message}
outputs:
- {label: trigger_out, domain: message}
file_format: 1
