id: ofdm_prs_ranging_prs_fft_receiver
label: PRS FFT Receiver
category: '[ofdm_prs_ranging]'
templates:
  imports: from gnuradio import ofdm_prs_ranging
  make: ofdm_prs_ranging.prs_fft_receiver(${samp_rate})
parameters:
- {id: samp_rate, label: Sample Rate, dtype: real, default: 10e6}
inputs:
- {label: frame_in, domain: message}
outputs:
- {label: symbols_out, domain: message}
documentation: |-
  Removes CP, optionally derotates samples using the frame's pre_fft_cfo_hz request,
  and computes the OFDM FFT. Phase is continuous across symbols and CPs, referenced
  to the original frame start. PMT samples, sample indices and UHD times are unchanged.
  Absent/nonfinite pre_fft_cfo_hz selects the original zero-compensation path.
  symbols_out records the actual applied pre_fft_cfo_hz for residual/total CFO bookkeeping.
file_format: 1
