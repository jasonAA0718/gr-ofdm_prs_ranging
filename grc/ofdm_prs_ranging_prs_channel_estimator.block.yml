id: ofdm_prs_ranging_prs_channel_estimator
label: PRS Channel Estimator
category: '[ofdm_prs_ranging]'
templates:
  imports: from gnuradio import ofdm_prs_ranging
  make: ofdm_prs_ranging.prs_channel_estimator(${samp_rate}, ${fft_len}, ${active_bins}, ${prs_symbols}, ${seed})
parameters:
- {id: samp_rate, label: Sample Rate, dtype: real, default: 10e6}
- {id: fft_len, label: FFT Length, dtype: int, default: 1024}
- {id: active_bins, label: Active Bins, dtype: int, default: 1024}
- {id: prs_symbols, label: PRS Symbols, dtype: int, default: 16}
- {id: seed, label: Legacy Pilot Seed (Unused), dtype: int, default: 13990001}
inputs:
- {label: symbols_in, domain: message}
outputs:
- {label: channel_out, domain: message}
file_format: 1
