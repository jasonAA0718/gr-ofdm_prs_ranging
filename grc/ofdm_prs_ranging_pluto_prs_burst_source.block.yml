id: ofdm_prs_ranging_pluto_prs_burst_source
label: Pluto PRS Burst Source
category: '[ofdm_prs_ranging]/Pluto'
templates:
  imports: from gnuradio import ofdm_prs_ranging
  make: |-
    ofdm_prs_ranging.pluto_prs_burst_source(
        ${samp_rate}, ${fft_len}, ${cp_len}, ${active_bins}, ${prs_symbols},
        ${preamble_len}, ${preamble_repeats}, ${coarse_sync_len},
        ${zero_guard_len}, ${tail_guard_len}, ${tx_amp}, ${seed},
        ${default_packet_type}, ${guard_samples}, ${coarse_zc_root})
parameters:
- {id: samp_rate, label: Sample Rate, dtype: real, default: 10e6}
- {id: fft_len, label: FFT Length, dtype: int, default: 1024}
- {id: cp_len, label: CP Length, dtype: int, default: 128}
- {id: active_bins, label: Active Bins, dtype: int, default: 1024}
- {id: prs_symbols, label: PRS Symbols, dtype: int, default: 16}
- {id: preamble_len, label: Preamble Length, dtype: int, default: 128}
- {id: preamble_repeats, label: Preamble Repeats, dtype: int, default: 16}
- {id: coarse_sync_len, label: Coarse Sync Length, dtype: int, default: 839}
- {id: coarse_zc_root, label: Coarse ZC Root, dtype: int, default: 25}
- {id: zero_guard_len, label: Zero Guard Length, dtype: int, default: 1000}
- {id: tail_guard_len, label: Tail Guard Length, dtype: int, default: 1000}
- {id: tx_amp, label: Payload/OFDM RMS, dtype: real, default: 0.6}
- {id: seed, label: Preamble Seed, dtype: int, default: 13990001}
- {id: default_packet_type, label: Default Packet Type, dtype: int, default: 1}
- {id: guard_samples, label: Trigger Guard Samples, dtype: int, default: 0}
inputs:
- {label: trigger, domain: message}
outputs:
- {label: out, domain: stream, dtype: complex}
- {label: tx_event_out, domain: message, optional: true}
file_format: 1
